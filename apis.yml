description: >-
  Citizens Financial Group is one of the oldest and largest financial
  institutions in the United States, serving individuals, small
  businesses, middle-market companies and large corporations through
  Citizens Bank and its subsidiaries. Citizens runs a public IBM API
  Connect developer portal at developer.citizensbank.com, with a matching
  sandbox at sandboxdeveloper.citizensbank.com, publishing twelve
  machine-readable contracts across four surfaces: an FDX-aligned account
  and statement surface, a commercial-banking surface (RTP and ACH
  payments, account validation, information reporting, internal
  transfer), an identity/authorize surface, and ATM and branch locators.
  The FDX Open Banking API launched in Q1 2025 gives business,
  commercial, wealth and private-banking customers one endpoint for
  sharing account and transaction data with authorized third parties.
  Access is partner-gated throughout, and sandbox testing is mandatory.
