commercial_model:
  self_service: false
  onboarding: >-
    An Implementation Manager runs a kickoff, collects security contacts, client IPs, the mTLS public
    key and a JWKS endpoint; production access follows sandbox sign-off and a mutually agreed go-live
    date.
  contracting: >-
    API charges are not separately listed. Payments settle as underlying ACH / RTP / wire transaction
    fees and account service charges under the client's commercial banking agreement; Account
    Validation is the one surface with a published per-call price.
  contact: https://www.citizensbank.com/corporate-finance/overview.aspx
