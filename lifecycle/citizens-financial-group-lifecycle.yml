    No SLA, uptime commitment or support-response target is published on the public developer portal.
    Commercial terms are set in the client's Citizens commercial banking agreement.

onboarding_lifecycle:
  stages:
    - name: Implementation
      detail: Implementation Manager kickoff; authorized security contacts named, client IPs collected for allowlisting, mTLS public key and JWKS endpoint supplied.
    - name: Testing and Signoff
      detail: All testing in the sandbox (https://sandboxdeveloper.citizensbank.com). Sandbox testing and message signing are required for the Payments API.
    - name: Going Live
      detail: A mutually agreed production date is set; Citizens registers the application and emails an invitation to create developer-portal credentials and retrieve the Client ID.
  source: https://developer.citizensbank.com/content/qut/CitizensPaymentAPIUserGuide.pdf section 2

