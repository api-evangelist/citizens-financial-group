openapi: 3.0.0
info:
  title: Account Validation
  description: "With the Account Validation API you can validate payee details to reduce payment processing\
    \ errors. You can validate Account Number, Routing Number, and Beneficiary. Many payments are made\
    \ in real-time and are irrevocable, confirming those payments go to the right counterparty is essential.\
    \ The following functions are available:\n\n   - Verify a bank account based on account number and\
    \ routing number.\n   - Verify the account status (open, closed, unverified, incorrect, rejected,\
    \ open credits only).\n   - Verify a beneficiary name match status (partial, full, no match).\n<br><br>\n\
    \nThe **Account Validation Services** offer the following key features:\n\n1. **Initiate Account Inquiry\
    \ API**:\n   - This endpoint initiates an account validation request by submitting the account details,\
    \ bank details, and beneficiary name. Upon successful submission, a unique reference ID is returned,\
    \ which can be used to track the status of the inquiry. If status is available immediately, /initiation\
    \ API response includes reference Id along with account inquiry status and name match status.\n  \
    \ - **Endpoint**: `v1/account-validation/initiation` (POST)\n   - **Purpose**: To initiate an account\
    \ validation request.\n\n2. **Get Account Inquiry Status API**:\n   - This endpoint retrieves the\
    \ status of an account inquiry request by providing the reference ID returned during the initiation\
    \ step. This API checks if the validation is still in progress, completed, or has failed, along with\
    \ any relevant status messages. Once the account inquiry is completed, the status can be requested\
    \ up to three times.\n   - **Endpoint**: `v1/account-validation/status` (GET)\n   - **Purpose**: To\
    \ retrieve account validation result using the reference ID.\n"
  contact:
    name: Commercial Sales team
    url: https://www.citizensbank.com/corporate-finance/overview.aspx?cmclmkt#next-step
