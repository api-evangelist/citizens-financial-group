        type: APIReference
    description: >-
      The Citizens Account Validation API verifies a payee's account
      number, routing number and beneficiary name before an irrevocable
      payment is sent, returning an account status (open, closed,
      unverified, incorrect, rejected, open-credits-only) and a name
      match status (full, partial, none). It is the one Citizens
      operation with a published unit price - $1.25 per successful
      validation - and the result may be read at most three times.
