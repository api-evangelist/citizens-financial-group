    description: >-
      The Citizens Authorize API is the Citizens identity provider that
      authenticates a partner and grants access to bank resources such
      as accounts and transactions. The published contract declares
      only the token revocation endpoint; the token endpoint that
      issues the credential is documented in the PDF user guides, and
      no OAuth or OpenID Connect discovery document is served on any
      Citizens host. Version 1.0 is production, 2.0 is sandbox.
