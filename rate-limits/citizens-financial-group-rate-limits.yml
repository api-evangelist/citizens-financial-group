  serviceUnavailable: 503
limits:
  - name: Sandbox limits
    scope: app
    metric: varies
    limit: see Citizens Developer Portal partner documentation
  - name: Production limits
    scope: app/partner
    metric: varies
    limit: per partner agreement; documented inside developer portal after onboarding
  - name: FDX bulk pull patterns
    scope: aggregator
    metric: varies
    limit: follow FDX recommended off-peak batch and event-based update patterns
policies:
  - name: Backoff Strategy
    description: Implement exponential backoff with jitter on HTTP 429/503 and honor any Retry-After
      header.
  - name: FDX schedule alignment
    description: Aggregators should align bulk consumer-data pulls with FDX-recommended off-peak
      windows to avoid throttling.
  - name: OAuth 2.0 / FAPI token handling
    description: Reuse access tokens until expiry to avoid consuming Authorization-Server rate budget.
