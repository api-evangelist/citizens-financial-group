description: FOCUS-aligned FinOps shape for Citizens Financial Group's developer APIs. Cost is driven
  by Citizens' underlying commercial banking, payments, treasury, and consumer-data services - APIs
  themselves are not separately metered; charges flow from per-transaction wire / ACH / RTP fees and
  account-level service charges.
notes: Per-API meters below are placeholders that mirror typical commercial banking and BNPL line
  items.
sources:
  - https://www.citizensbank.com
billingModel:
  pricingCategory: Take Rate + Per-Transaction Fees
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Tax
    - Adjustment
    - Refund
    - Credit
focusColumns:
  ServiceName: Citizens Financial Group
  ServiceCategory: Banking
  ProviderName: Citizens Financial Group
  PublisherName: Citizens Bank, N.A.
  InvoiceIssuerName: Citizens Bank, N.A.
  BillingCurrency: USD
  ChargeCategory: Usage
meters:
  - name: payment_transactions
    description: ACH / Wire / RTP payments initiated via Citizens APIs.
    unit: transaction
    aggregation: sum
    dimensions:
      - rail
      - direction
      - geography
  - name: bnpl_volume
    description: Buy Now Pay Later financed volume routed through Citizens partner APIs.
    unit: notional
    aggregation: sum
    dimensions:
      - merchant
      - product
  - name: account_services
    description: Monthly account-level service charges (statement reporting, balance reporting).
    unit: account-month
    aggregation: max
    dimensions:
      - account_type
  - name: api_calls
    description: API call counts (informational; not directly billed).
    unit: request
    aggregation: sum
    dimensions:
      - api_product
      - environment
principles:
  - name: Visibility
    description: Use Citizens commercial account-analysis statements, FDX consent dashboards, and the
      developer portal usage view to track API consumption alongside transaction fees.
  - name: Allocation
    description: Tag every API client to a Citizens account, partner, and business unit so wire / ACH /
      BNPL line items can be attributed back to the consuming team.
  - name: Optimization
    description: Route low-priority payments through ACH instead of wire, batch FDX consumer-data
      pulls during off-peak windows, and reuse OAuth tokens.
  - name: Accountability
    description: Treasury operations owns Citizens service-fee budgets; partner-integration owners
      are accountable for clean reconciliation, FDX consent posture, and exception management.
