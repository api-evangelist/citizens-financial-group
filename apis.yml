      The Citizens Information Reporting API lets an authenticated
      consumer retrieve the authorized account list, deposit account
      balances and transaction history for Citizens Bank checking and
      savings accounts. It is the only paginated surface Citizens
      publishes - required pageOffset and pageLimit on the account
      list, and a nextKey cursor with a 100-record default and a
      2000-record maximum on transactions.
