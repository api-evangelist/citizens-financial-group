    description: >-
      The Citizens Payments API initiates RTP and ACH payment
      instructions, retrieves payment status, and checks whether a
      counterparty routing number is reachable on The Clearing House RTP
      network before a payment is sent. Reject codes are ISO 20022
      external status reason codes; ACH details carry Nacha standard
      entry class codes. No cancel, void or reversal operation is
      published on this surface.
