x-pointer-verification:
  checked: '2026-09-05'
  method: probed
  note: >-
    Every http(s) pointer above was fetched on 2026-09-05 with a browser User-Agent, following
    redirects, and the body was read rather than trusting the status line. Four pointers carried in
    earlier rounds were confirmed dead and removed rather than left to rot.
  removed:
    - url: https://citizensbank.openbankproject.com/
      was: Open Bank Project Sandbox
      status: 0
      reason: DNS does not resolve (NXDOMAIN). The live sandbox is Citizens' own portal at sandboxdeveloper.citizensbank.com.
    - url: https://developer-citizenspay.citizensbank.com/
      was: Citizens Pay Portal
      status: 0
      reason: DNS does not resolve (NXDOMAIN). No replacement Citizens Pay developer surface was found.
    - url: https://www.citizensbank.com/customer-service/online-banking-service-agreement.aspx
      was: TermsOfService
      status: 404
      reason: Returns the Citizens 404 page. Replaced with the live Terms of Use page.
    - url: https://www.citizensbank.com/customer-service/overview.aspx
      was: Support
      status: 404
      reason: Returns the Citizens 404 page. Replaced with the developer-portal support page and the live Contact Us page.
  not_emitted:
    - surface: Blog
      url: https://developer.citizensbank.com/blog
      status: 200
      reason: 'Serves the portal shell reading "No blog entries have been created." A 200 with no content is not a blog.'
    - surface: GitHubOrganization
      url: https://github.com/citizensbank
      status: 200
      reason: >-
        The org exists but carries no name, no description, no website and zero public repositories,
        so it cannot be attributed to Citizens Financial Group from anything it publishes.
    - surface: Postman
      status: 0
      reason: A Postman public search for "citizens bank" returned zero collections, workspaces and APIs.
    - surface: WellKnown / SecurityTxt
      reason: >-
        Every /.well-known/ path 404s or returns the portal search shell on every Citizens host.
        The probe is recorded in well-known/ and no pointer is emitted. See that file.
    - surface: AgentCard
      reason: >-
        /.well-known/agent-card.json and /.well-known/agent.json probed on all eight Citizens hosts
        on 2026-09-05 - 404, 403 or connection timeout. No card is served, so nothing was written.
    - surface: SDKs / Packages
      reason: >-
        No first-party client library exists in any registry. packages/ records the zero and no
        SDKs pointer is emitted.
    - surface: StatusPage / Deprecation / ChangeLog
      reason: >-
        Citizens publishes no status page, deprecation policy or changelog. lifecycle/ records the
        probes and no pointer is emitted for any of them.
    - surface: Compliance
      reason: >-
        No trust center or named certification (SOC 2 / ISO 27001 / PCI) is published. FDIC
        membership and Federal Reserve / OCC supervision are not an API compliance program.
