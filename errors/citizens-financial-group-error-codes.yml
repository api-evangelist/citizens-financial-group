    description: A server-side error occurred, possibly due to an upstream service failure
    http_status: 500
  - code: CIE-501
    status: Not Implemented
    description: The server does not recognize or support the request method
    http_status: 501
  - code: CIE-502
    status: Bad Gateway
    description: The server received an invalid response from an upstream server. Request timeout
    http_status: 502
  - code: CIE-504
    description: error The server did not receive a timely response from an upstream server.
