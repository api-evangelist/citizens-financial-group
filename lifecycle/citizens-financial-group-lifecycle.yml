    No deprecation policy, sunset schedule or RFC 8594 Deprecation/Sunset header is published on
    developer.citizensbank.com, and no operation in any of the 12 harvested contracts carries
    `deprecated: true`. Version retirement appears to be handled bilaterally through the
    Implementation Manager rather than announced publicly.

