      The Citizens Account Transfer API moves funds near real-time
      between accounts a client already holds at Citizens. Single
      same-day transfers only - batch and future-dated transfers are
      not supported in this version - with a minimum amount of $0.01.
      No duplicate-key protection, status lookup or reversal operation
      is published on this surface.
