method: searched
source: https://developer.citizensbank.com/content/qut/CitizensPaymentAPIUserGuide.pdf (v1.3, updated 2025-12-11)
  section 6.4 "RTP Reject Codes".
provider: Citizens Financial Group
providerId: citizens-financial-group
applies_to: Payments API v3 - RTP rail only. ACH returns are not exposed as a code list in the published contract.
delivery:
  operation: retrievePaymentStatus (POST /v3/payments/payment-status/query)
  envelope_fields:
  - paymentStatus (RECEIVED | IN_PROGRESS | COMPLETED | REJECTED | EXPORTED | ACKNOWLEDGED)
  - rejectCode
  - rejectDescription
  - bankReferenceNumber
  - networkInstructionId
  note: For RTP the final accept/reject outcome is NOT available from the initiate-payment response; a subsequent
    payment-status query is required. Example rejectCode published in the OpenAPI is PMT2005 "Debtor account type
    invalid".
masked_to_buyers: Not applicable / not published. Citizens does not document any code that is withheld from the
  API consumer; the reject code and description are returned verbatim on the payment status response.
standard:
  name: ISO 20022 external payment status reason codes
  note: The majority of these codes (AC02/AC03/AC04/AC06/AC11/AC13/AC14, AG01/AG03, AM02-AM14, BE04-BE17, DS04/DS24,
    DT04, DUPL, FF02/FF08, MD07, NARR, RC01-RC04, TM01) are ISO 20022 ExternalStatusReason1Code values carried through
    The Clearing House RTP network. Citizens mixes them with network-specific numeric codes (650, 690, 9909-9964)
    and its own TK/GF/RF prefixes.
