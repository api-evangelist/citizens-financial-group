specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Citizens Financial Group
providerId: citizens-financial-group
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Banking
  - Financial Services
  - Payments
  - Open Banking
  - FDX
description: Citizens Financial Group is a US bank holding company (Citizens Bank). It exposes
  account, payments, and consumer-data APIs to vetted FinTech and corporate partners through its
  developer portal and FDX-aligned data-sharing program. Per-API pricing is not publicly published;
  commercial terms flow through master agreements covering retail banking, commercial banking, and
  data-sharing partnerships.
notes: No public per-API price list. Replace with negotiated terms once available. This repo overlaps
  with citizens-financial; both describe the same legal entity.
sources:
  - https://www.citizensbank.com
  - https://investor.citizensbank.com
plans:
  - id: citizens-financial-group-developer-sandbox
    name: Citizens Developer Sandbox
    type: freemium
    description: Free sandbox access for vetted FinTech and corporate partners to evaluate Citizens
      APIs (FDX-aligned account aggregation, payments, locator). Production access requires a
      commercial / data-sharing agreement.
    entries:
      - label: Sandbox access
        name: sandbox
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: US
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: Sandbox API access
      - name: FDX-aligned schemas
      - name: OAuth 2.0 / FAPI authentication flows
  - id: citizens-financial-group-partner-production
    name: Citizens Partner / Commercial Production
    type: enterprise
    description: Production API access for FinTech aggregators (FDX), Buy Now Pay Later partners, and
      commercial banking customers. Pricing rolls into the customer's broader Citizens commercial
      banking or data-sharing agreement.
    entries:
      - label: Negotiated commercial terms
        name: enterprise
        type: subscription
        metric: contract
        limit: -1
        timeFrame: year
        geo: US
        unit: 1
        price: contact Citizens partnerships / commercial banking
        userMultiplied: false
    elements:
      - name: FDX consumer-data sharing APIs
      - name: Account & balance reporting
      - name: Payments APIs (ACH, Wire, RTP)
      - name: Branch / ATM locator APIs
      - name: Buy Now Pay Later partner APIs
maintainers:
