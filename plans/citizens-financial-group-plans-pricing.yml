description: >-
  Citizens publishes named API plans on its IBM API Connect developer portal - each product carries
  one or more plans with an advertised rate limit and a subscribe button - but it publishes almost no
  prices. Every plan page reads "Rate limits" and "Terms and conditions", not a monetary rate.
  Subscription is request-and-approve, not self-service: the portal routes each request to a Citizens
  API administrator. The single exception is the Account Validation API, where the user guide states
  a per-transaction price outright.
notes: >-
  plan_count below counts distinct published portal plans across both environments. Commercial terms
  for production access roll into the client's Citizens commercial banking or data-sharing agreement
  and are not published.
