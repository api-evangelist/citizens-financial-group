notes:
- 'Codes are shared across APIs by prefix: AUT4001 (authorization), CON5000 (connection), DEF0001 (internal), BDR4000/BDR4001
  (bad request), REQ1001-REQ1003 (request id validation), CIE-4xx (gateway-level).'
- RTP network reject codes are a separate ISO 20022 external-reason vocabulary and are catalogued in errors/citizens-financial-group-decline-codes.yml.
- Citizens does not publish RFC 9457 application/problem+json; the envelope is proprietary.
