    commercial, wealth, and private- banking customers a single endpoint to share account balances, transactions,
    and other financial data with authorized third-party platforms. It is the program name for the /fdx/
    surface; its machine-readable contracts are registered under the Citizens Accounts API and Citizens
    Statements API entries below, which is where the harvested FDX v1.0 and v2.1 specs live.
