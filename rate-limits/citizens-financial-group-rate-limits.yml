description: Citizens Financial Group APIs are partner-onboarded via a developer portal. Public
  quantitative rate-limit thresholds are not published; per-second / per-minute limits are documented
  inside the partner developer portal once production access is provisioned. FDX consumer-data
  sharing endpoints follow FDX recommended throttle / batch patterns.
notes: Verify exact thresholds inside Citizens partner documentation after onboarding.
